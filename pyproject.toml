[project]
name = "depth-map-through-vllm-router"
version = "0.1.0"
description = "Serve VGGT-Omega 3D mapping behind an OpenAI-compatible API, so it can sit next to vLLM models behind a router"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "httpx",
    "uvicorn[standard]",
    "numpy<2",
    "pillow",
]

[project.scripts]
mapper-web = "mapper.web:main"
mapper-server = "mapper.server:main"

[project.optional-dependencies]
model = [
    "torch>=2.6",
    "torchvision>=0.21",
    "vggt-omega @ git+https://github.com/facebookresearch/vggt-omega@48b23c8",
]
test = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mapper"]
[tool.hatch.metadata]
allow-direct-references = true
